# TEMPLATE — copy to .github/workflows/textos-intake.yml and put the site's own gates where marked.
#
# Manual only. Once a person approved a release decision in TextOS, run it with the decision id:
# it receives and verifies the release, runs the site's gates, and pushes a branch for review.
# A person opens the pull request from the link in the run summary and merges it.
#
# Needs the repository secrets TEXTOS_API_BASE_URL and TEXTOS_API_TOKEN (a service token of the
# site's TextOS workspace), and a workspace assigned in textos-intake.config.json.
name: Receive a TextOS release

on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: "Id of the approved TextOS release decision"
        required: true
        type: string
      job_id:
        description: "Release job id — only to resume a release that already started"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: textos-intake
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    env:
      DECISION_ID: ${{ inputs.decision_id }}
      JOB_ID: ${{ inputs.job_id }}
      # = releasesDir in textos-intake.config.json
      RELEASES_DIR: content/textos-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pnpm sites: pnpm/action-setup, then `pnpm install --frozen-lockfile`.
      - run: npm ci
      - name: Receive and verify the release
        env:
          TEXTOS_API_BASE_URL: ${{ secrets.TEXTOS_API_BASE_URL }}
          TEXTOS_API_TOKEN: ${{ secrets.TEXTOS_API_TOKEN }}
        run: npx tsx scripts/textos-intake.ts receive --decision "$DECISION_ID" ${JOB_ID:+--job "$JOB_ID"}
      - name: Re-verify every received release
        run: npx tsx scripts/textos-intake.ts check
      # The site's own gates (typecheck, tests, build) go here.
      - run: npm test
      - name: Push a branch for review
        run: |
          if [ -z "$(git status --porcelain -- "$RELEASES_DIR")" ]; then
            echo "Nothing new: this release is already in the site." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="textos-intake/$(printf '%s' "$DECISION_ID" | tr -c 'A-Za-z0-9._-' '-')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$RELEASES_DIR"
          git commit -m "content(textos-api): receive the release approved in decision $DECISION_ID"
          git push origin "$branch"
          echo "Review and open the pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"

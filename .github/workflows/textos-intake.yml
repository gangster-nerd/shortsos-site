name: Receive a TextOS release

# Manual only. Once a person approved a release decision in TextOS, run this with its id. It runs
# the release with this site's service token, verifies it (packages/textos-intake), runs every
# gate CI runs, and pushes a branch with textos/api/<slug>/. A person opens the pull request from
# the link in the run summary and merges it: nothing reaches main without that review.
#
# Needs the repository secrets TEXTOS_API_BASE_URL and TEXTOS_API_TOKEN (a service token of this
# site's TextOS workspace), and a workspace assigned in sources/textos.json.
on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: "Id of the approved TextOS release decision"
        required: true
        type: string
      job_id:
        description: "Release job id — only to resume a release that already started"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: textos-intake
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    env:
      DECISION_ID: ${{ inputs.decision_id }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Receive and verify the release
        env:
          TEXTOS_API_BASE_URL: ${{ secrets.TEXTOS_API_BASE_URL }}
          TEXTOS_API_TOKEN: ${{ secrets.TEXTOS_API_TOKEN }}
        run: npm run textos:intake -- receive --decision "$DECISION_ID" ${JOB_ID:+--job "$JOB_ID"}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run content:verify
      - run: npm run validate:jsonld
      - name: Push a branch for review
        run: |
          if [ -z "$(git status --porcelain -- textos/api)" ]; then
            echo "Nothing new: this release is already in the site." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="textos-intake/$(printf '%s' "$DECISION_ID" | tr -c 'A-Za-z0-9._-' '-')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- textos/api
          git commit -m "content(textos-api): receive the release approved in decision $DECISION_ID"
          git push origin "$branch"
          echo "Review and open the pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1" >> "$GITHUB_STEP_SUMMARY"
